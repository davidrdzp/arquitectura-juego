<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>out-of-order-runner</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Menú de inicio: elección de dificultad (visibilidad controlada desde main.ts) -->
    <div
      id="menu"
      class="fixed inset-0 z-40 overflow-y-auto bg-black/70 p-3"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menu-title"
    >
      <div class="flex min-h-full items-center justify-center">
      <div
        class="w-full max-w-md border-2 border-cyan-400 bg-neutral-950/95 p-5 font-mono text-cyan-300 shadow-[0_0_30px_rgba(0,255,255,0.4)] md:p-8"
      >
        <h1 id="menu-title" class="mb-1 text-2xl font-bold tracking-widest text-cyan-200 md:text-3xl">OUT-OF-ORDER RUNNER</h1>
        <p class="mb-6 border-b border-cyan-400/40 pb-3 text-xs text-cyan-400/70">// Elige la dificultad del pipeline</p>

        <div class="flex flex-col gap-3">
          <button type="button" class="menu-option" data-difficulty="easy">
            <span>1 · FÁCIL</span>
            <small>Menos obstáculos, velocidad sube lento, salto casi sin cooldown</small>
          </button>
          <button type="button" class="menu-option" data-difficulty="normal">
            <span>2 · NORMAL</span>
            <small>La experiencia estándar</small>
          </button>
          <button type="button" class="menu-option" data-difficulty="hard">
            <span>3 · DIFÍCIL</span>
            <small>Arranca a 1.25x, más obstáculos y cooldown de salto largo</small>
          </button>
        </div>

        <p class="mt-5 text-xs text-cyan-400/60">
          // W/S o ↑/↓ + Enter, teclas 1-3 o clic. En juego: W/S o ↑/↓ carril · Espacio salta (con cooldown)
        </p>
      </div>
      </div>
    </div>

    <!-- Modal del Quiz (visibilidad controlada desde main.ts) -->
    <div
      id="quiz-modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="quiz-title"
    >
      <div
        class="w-full max-w-2xl border-2 border-green-400 bg-neutral-950 p-6 font-mono text-green-400 shadow-[0_0_30px_rgba(57,255,20,0.45)] md:p-8"
      >
        <div class="mb-4 flex items-center justify-between border-b border-green-400/40 pb-3">
          <h2 id="quiz-title" class="text-lg font-bold tracking-widest text-green-300 md:text-xl">
            &gt; INTERRUPCIÓN DE HARDWARE_
          </h2>
          <span id="quiz-counter" class="text-xs text-green-400/70"></span>
        </div>

        <p id="quiz-question" class="mb-6 text-base leading-relaxed text-green-100 md:text-lg"></p>

        <div id="quiz-options" class="flex flex-col gap-3">
          <button type="button" data-index="0" class="quiz-option"></button>
          <button type="button" data-index="1" class="quiz-option"></button>
          <button type="button" data-index="2" class="quiz-option"></button>
          <button type="button" data-index="3" class="quiz-option"></button>
        </div>

        <p class="mt-5 text-xs text-green-400/60">// Mouse, W/S o ↑/↓ + Enter, o teclas 1-4 / A-D</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
